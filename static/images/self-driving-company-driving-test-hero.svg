<g font-family="Arial, Helvetica, sans-serif">
<text x="75" y="140" font-weight="700" font-size="67" letter-spacing="-2" fill="#f4f7fa">The Self-Driving Company</text>
<text x="75" y="225" font-weight="700" font-size="67" letter-spacing="-2" fill="#f4f7fa">Needs a Driving Test</text>
<path d="M83 267v75" stroke="#45cbbd" stroke-width="5"/>
