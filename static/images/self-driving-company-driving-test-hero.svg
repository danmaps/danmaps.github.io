<linearGradient id="hud" x1="0" x2="1"><stop stop-color="#56d5ce"/><stop offset="1" stop-color="#b5f3e6"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#2a8197" stop-opacity=".45"/><stop offset="1" stop-color="#2a8197" stop-opacity="0"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
